<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Find</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
  <a href="index.html"><i id="navicon" class="fa-solid fa-circle-chevron-left"></i></a>
</div>

<form id="lostForm">
  <h2>Report Lost Item</h2>

  <input id="ownerName" placeholder="Your Name" required>
  <input id="itemName" placeholder="Item Name" required>
  <input id="location" placeholder="Location Lost" required>
  <input id="date" type="datetime-local" required>
  <textarea id="description" placeholder="Description" required></textarea>
  <input id="email" placeholder="Email" required>
  <input id="phone" placeholder="Phone" required>

  <button type="submit">Submit</button>
  
</form>

<script src="script.js"></script>
</body>
</html>
