<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claim Item</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
  <a href="index.html"><i id="navicon" class="fa-solid fa-circle-chevron-left"></i></a>
</div>

<form id="claimForm">

  <h2>Claim Item</h2>

  <input id="itemName" placeholder="Item Name" readonly>
  <input id="itemId" placeholder="Item ID" readonly>
  <input id="name" placeholder="Your Name" required>
  <input id="email" placeholder="Email" required>
  <textarea id="description" placeholder="Describe the item to verify ownership" required></textarea>
  <input id="phone" placeholder="Phone Number" required>
  <button type="submit">Submit Claim</button>

</form>

<script src="script.js"></script>
</body>
</html>
